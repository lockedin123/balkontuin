# De post-ironische absurdistische cultuur op het internet.

Hoe brainrot invloed heeft op onze cultuur, onze politiek en onze leefomgevig....

---

# Inhoudopgave


1. Onderwerp
2. 10 links
3. 50 afbeeldingen
4. ...(max 11 slides, 15 totaal)
5. introtekst van max. 180 tekens

---

# Onderwerp

Mijn vreemde absurde intresse is het verzamelen van absurde kunst van sociale media. 
Dan spreken we over internet stickers, edits en andere psots op het internet. De oorspronkelijke reden waarom ik dit begon te doen is om er kunst van te maken en uitschilderen.

---

# intro tekst

Tijdens periodes van onzekerheid zullen mensen altijd een manier vinden om diens mening te uiten.
We kijken dan naar verhalen, pamfletten, posters, graffiti, en boeken. Protest heeft altijd bestaan, en zal blijven bestaan.

Tegenwoordig heb je niet alleen de fysieke wereld, maar ook de digitale wereld waar mensen memes en brainrot gebruiken als digitale graffiti. Als protest, maar ook om beter om te gaan met de paniek van de huidige wereld.

Het is natuurlijk waar dat niet elke foto die online staat diepgang heeft. Dat kan ik realiseren, maar er zijn overal kathedralen waar onze naar kunnen kijken, aldus een tweet van twitter.com
